AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Serverless Task Tracker API - API Gateway (HTTP API) + Lambda (Python) + DynamoDB.
  Each Lambda function has its own IAM role allowing only the one DynamoDB action it needs.

Parameters:
  StageName:
    Type: String
    Default: dev
  LogRetentionDays:
    Type: Number
    Default: 7

Resources:
  # ---------------------------------------------------------------- DynamoDB
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-tasks"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------- API
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, DELETE]
        AllowHeaders: [content-type]

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref StageName
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 10   # requests per second
        ThrottlingBurstLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionDays

  # ================================================================ CREATE
  CreateTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: put-item-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt TasksTable.Arn

  CreateTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-create-task"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CreateTaskRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Code:
        ZipFile: |
          import json, os, uuid
          from datetime import datetime, timezone
          import boto3

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          VALID_STATUS = {"todo", "in-progress", "done"}

          def reply(code, body):
              return {"statusCode": code, "headers": {"Content-Type": "application/json"},
                      "body": json.dumps(body)}

          def handler(event, context):
              try:
                  data = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return reply(400, {"error": "Body must be valid JSON"})
              title = str(data.get("title", "")).strip()
              status = data.get("status", "todo")
              if not title:
                  return reply(400, {"error": "title is required"})
              if len(title) > 200:
                  return reply(400, {"error": "title must be 200 characters or less"})
              if status not in VALID_STATUS:
                  return reply(400, {"error": f"status must be one of {sorted(VALID_STATUS)}"})
              now = datetime.now(timezone.utc).isoformat()
              item = {"id": str(uuid.uuid4()), "title": title, "status": status,
                      "createdAt": now, "updatedAt": now}
              table.put_item(Item=item)
              print(json.dumps({"action": "create", "id": item["id"]}))
              return reply(201, item)

  CreateTaskLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateTaskFunction}"
      RetentionInDays: !Ref LogRetentionDays

  CreateTaskIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CreateTaskFunction.Arn
      PayloadFormatVersion: "2.0"

  CreateTaskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /tasks
      Target: !Sub "integrations/${CreateTaskIntegration}"

  CreateTaskPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateTaskFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/tasks"

  # ================================================================ LIST
  ListTasksRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: scan-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt TasksTable.Arn

  ListTasksFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-list-tasks"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ListTasksRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Code:
        ZipFile: |
          import json, os
          import boto3

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])

          def reply(code, body):
              return {"statusCode": code, "headers": {"Content-Type": "application/json"},
                      "body": json.dumps(body)}

          def handler(event, context):
              params = event.get("queryStringParameters") or {}
              status = params.get("status")
              items, kwargs = [], {}
              if status:
                  kwargs["FilterExpression"] = "#s = :s"
                  kwargs["ExpressionAttributeNames"] = {"#s": "status"}
                  kwargs["ExpressionAttributeValues"] = {":s": status}
              while True:  # follow pagination so large tables return everything
                  page = table.scan(**kwargs)
                  items.extend(page.get("Items", []))
                  if "LastEvaluatedKey" not in page:
                      break
                  kwargs["ExclusiveStartKey"] = page["LastEvaluatedKey"]
              items.sort(key=lambda t: t["createdAt"], reverse=True)
              return reply(200, {"count": len(items), "tasks": items})

  ListTasksLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ListTasksFunction}"
      RetentionInDays: !Ref LogRetentionDays

  ListTasksIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ListTasksFunction.Arn
      PayloadFormatVersion: "2.0"

  ListTasksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /tasks
      Target: !Sub "integrations/${ListTasksIntegration}"

  ListTasksPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ListTasksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/tasks"

  # ================================================================ GET ONE
  GetTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: get-item-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt TasksTable.Arn

  GetTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-task"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt GetTaskRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Code:
        ZipFile: |
          import json, os
          import boto3

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])

          def reply(code, body):
              return {"statusCode": code, "headers": {"Content-Type": "application/json"},
                      "body": json.dumps(body)}

          def handler(event, context):
              task_id = (event.get("pathParameters") or {}).get("id")
              item = table.get_item(Key={"id": task_id}).get("Item")
              if not item:
                  return reply(404, {"error": "Task not found"})
              return reply(200, item)

  GetTaskLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetTaskFunction}"
      RetentionInDays: !Ref LogRetentionDays

  GetTaskIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetTaskFunction.Arn
      PayloadFormatVersion: "2.0"

  GetTaskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /tasks/{id}
      Target: !Sub "integrations/${GetTaskIntegration}"

  GetTaskPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetTaskFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/tasks/*"

  # ================================================================ UPDATE
  UpdateTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: update-item-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt TasksTable.Arn

  UpdateTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-update-task"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt UpdateTaskRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Code:
        ZipFile: |
          import json, os
          from datetime import datetime, timezone
          import boto3
          from botocore.exceptions import ClientError

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          VALID_STATUS = {"todo", "in-progress", "done"}

          def reply(code, body):
              return {"statusCode": code, "headers": {"Content-Type": "application/json"},
                      "body": json.dumps(body)}

          def handler(event, context):
              task_id = (event.get("pathParameters") or {}).get("id")
              try:
                  data = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return reply(400, {"error": "Body must be valid JSON"})
              fields = {}
              if "title" in data:
                  title = str(data["title"]).strip()
                  if not title or len(title) > 200:
                      return reply(400, {"error": "title must be 1-200 characters"})
                  fields["title"] = title
              if "status" in data:
                  if data["status"] not in VALID_STATUS:
                      return reply(400, {"error": f"status must be one of {sorted(VALID_STATUS)}"})
                  fields["status"] = data["status"]
              if not fields:
                  return reply(400, {"error": "Send title and/or status to update"})
              fields["updatedAt"] = datetime.now(timezone.utc).isoformat()
              names = {f"#{k}": k for k in fields}
              values = {f":{k}": v for k, v in fields.items()}
              expr = "SET " + ", ".join(f"#{k} = :{k}" for k in fields)
              try:
                  result = table.update_item(
                      Key={"id": task_id},
                      UpdateExpression=expr,
                      ExpressionAttributeNames=names,
                      ExpressionAttributeValues=values,
                      ConditionExpression="attribute_exists(id)",  # no silent creates
                      ReturnValues="ALL_NEW",
                  )
              except ClientError as e:
                  if e.response["Error"]["Code"] == "ConditionalCheckFailedException":
                      return reply(404, {"error": "Task not found"})
                  raise
              print(json.dumps({"action": "update", "id": task_id, "fields": list(fields)}))
              return reply(200, result["Attributes"])

  UpdateTaskLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${UpdateTaskFunction}"
      RetentionInDays: !Ref LogRetentionDays

  UpdateTaskIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt UpdateTaskFunction.Arn
      PayloadFormatVersion: "2.0"

  UpdateTaskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: PUT /tasks/{id}
      Target: !Sub "integrations/${UpdateTaskIntegration}"

  UpdateTaskPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateTaskFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/tasks/*"

  # ================================================================ DELETE
  DeleteTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: delete-item-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt TasksTable.Arn

  DeleteTaskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-delete-task"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DeleteTaskRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Code:
        ZipFile: |
          import json, os
          import boto3

          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])

          def handler(event, context):
              task_id = (event.get("pathParameters") or {}).get("id")
              old = table.delete_item(Key={"id": task_id}, ReturnValues="ALL_OLD").get("Attributes")
              if not old:
                  return {"statusCode": 404, "headers": {"Content-Type": "application/json"},
                          "body": json.dumps({"error": "Task not found"})}
              print(json.dumps({"action": "delete", "id": task_id}))
              return {"statusCode": 204, "body": ""}

  DeleteTaskLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DeleteTaskFunction}"
      RetentionInDays: !Ref LogRetentionDays

  DeleteTaskIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt DeleteTaskFunction.Arn
      PayloadFormatVersion: "2.0"

  DeleteTaskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: DELETE /tasks/{id}
      Target: !Sub "integrations/${DeleteTaskIntegration}"

  DeleteTaskPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeleteTaskFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/tasks/*"

  # ---------------------------------------------------------------- Alarm
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: API returned server errors in the last 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: !Ref StageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  TableName:
    Value: !Ref TasksTable
